name: Agent ledger integration
on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  agent-ledger-checks:
    name: Agent ledger integration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: local-pilot-only
          POSTGRES_DB: notron_agents_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r agents/requirements.txt
      - name: Exercise local database transactions and least-privilege roles
        env:
          AGENT_TEST_DATABASE_URL: postgresql://postgres:local-pilot-only@127.0.0.1:5432/notron_agents_test?sslmode=disable
        run: python agents/run_ledger_tests.py
