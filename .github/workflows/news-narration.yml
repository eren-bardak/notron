name: Nötron news narration
on:
  push:
    branches: [main]
    paths:
      - 'backend/news_narration.py'
      - '.github/workflows/news-narration.yml'
  workflow_dispatch:
  workflow_run:
    workflows: ['Nötron news pipeline', 'Nötron card stories']
    types: [completed]
permissions:
  contents: read
concurrency:
  group: notron-narration
  cancel-in-progress: false
jobs:
  narration:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    concurrency:
      group: notron-production-news
      cancel-in-progress: false
    timeout-minutes: 20
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r backend/requirements.txt
      - run: python -m unittest discover -s tests -p 'test_news_narration.py'
      - name: Narrate the three featured stories
        working-directory: backend
        run: python news_narration.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: news-narrations
          path: backend/narrations.json
          if-no-files-found: warn
          retention-days: 7
