name: Export public editorial review
on:
  push:
    branches: [main]
    paths: ['.github/workflows/editorial-review-export.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r backend/requirements.txt
      - name: Export public event content only
        working-directory: backend
        run: python export_editorial_review.py
      - uses: actions/upload-artifact@v4
        with:
          name: editorial-review
          path: backend/editorial-review.json
          if-no-files-found: error
          retention-days: 7
