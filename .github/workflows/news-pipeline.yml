name: Nötron news pipeline
on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'tests/**'
      - 'config/popularity.json'
      - '.github/workflows/news-pipeline.yml'
      - 'render.yaml'
  pull_request:
    paths:
      - 'backend/**'
      - 'tests/**'
      - 'config/popularity.json'
      - '.github/workflows/news-pipeline.yml'
      - 'render.yaml'
  workflow_dispatch:
    inputs:
      mode:
        description: 'test: no API calls; economy: daily three-story budget; full: uncapped legacy runner'
        type: choice
        required: true
        default: test
        options: [test, economy, full, resume, scores, supplement]
# The daily schedule moves to Render. Merge this cutover only after Render is ready.
permissions:
  contents: read
jobs:
  checks:
    name: Offline checks (no OpenAI calls)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Test with network and dotenv loading disabled
        run: python backend/run_pipeline.py --mode test
  refresh:
    name: Live news refresh
    needs: checks
    # Code pushes and the default manual test never start paid work.
    if: github.event_name == 'workflow_dispatch' && (inputs.mode == 'economy' || inputs.mode == 'full')
    runs-on: ubuntu-latest
    timeout-minutes: 180
    concurrency:
      group: notron-production-news
      cancel-in-progress: false
    env:
      PIPELINE_MODE: ${{ inputs.mode == 'full' && 'full' || 'economy' }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Validate runner configuration
        run: python backend/run_pipeline.py --mode "$PIPELINE_MODE" --check
      - name: Fetch, group, research and publish
        run: python backend/run_pipeline.py --mode "$PIPELINE_MODE"
      - name: Export public evidence and questions for review
        if: always()
        working-directory: backend
        run: python export_editorial_review.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: editorial-review
          path: backend/editorial-review.json
          if-no-files-found: warn
          retention-days: 7
  maintenance:
    name: Bounded score refresh and retry
    needs: checks
    if: >-
      (github.event_name == 'workflow_dispatch' && (inputs.mode == 'resume' || inputs.mode == 'scores' || inputs.mode == 'supplement')) ||
      (github.event_name == 'push' && (contains(github.event.head_commit.message, '[bounded-resume]') || contains(github.event.head_commit.message, '[scores-only]') || contains(github.event.head_commit.message, '[category-refresh]')))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: notron-production-news
      cancel-in-progress: false
    env:
      OPERATION: ${{ (inputs.mode == 'supplement' || contains(github.event.head_commit.message, '[category-refresh]')) && 'supplement' || (inputs.mode == 'scores' || contains(github.event.head_commit.message, '[scores-only]')) && 'scores' || 'resume' }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Reuse original stories and shared daily budget
        run: |
          if [ "$OPERATION" = scores ]; then
            python backend/run_pipeline.py --mode economy --scores-only
          elif [ "$OPERATION" = supplement ]; then
            python backend/run_pipeline.py --mode economy --supplement
          else
            python backend/run_pipeline.py --mode economy --resume
          fi
