name: Nötron background context
on:
  push:
    branches: [main]
    paths:
      - 'backend/deep_dive/background_context.py'
      - 'backend/deep_dive/reviewed_backgrounds.json'
      - 'backend/refresh_backgrounds.py'
      - 'tests/test_background_context.py'
      - 'tests/test_single_data_question.py'
      - '.github/workflows/background-context.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: notron-background-context
  cancel-in-progress: false
jobs:
  backgrounds:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[background]')
    runs-on: ubuntu-latest
    concurrency:
      group: notron-production-news
      cancel-in-progress: false
    timeout-minutes: 40
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r backend/requirements.txt
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Restore the missing explanatory context
        working-directory: backend
        run: python refresh_backgrounds.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: background-contexts
          path: backend/background-contexts.json
          if-no-files-found: warn
          retention-days: 7
